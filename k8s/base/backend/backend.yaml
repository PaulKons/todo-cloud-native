apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: todo-app
spec:
  replicas: 3
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: localhost:32000/todo-backend:1.0
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
          env:
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: todo-config
                  key: BACKEND_PORT

            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: todo-config
                  key: NODE_ENV

            - name: RABBITMQ_URL
              valueFrom:
                configMapKeyRef:
                  name: todo-config
                  key: RABBITMQ_URL

            - name: REMINDER_QUEUE
              valueFrom:
                configMapKeyRef:
                  name: todo-config
                  key: REMINDER_QUEUE

            - name: ATTACHMENT_QUEUE
              valueFrom:
                configMapKeyRef:
                  name: todo-config
                  key: ATTACHMENT_QUEUE

            - name: MINIO_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: todo-config
                  key: MINIO_ENDPOINT

            - name: MINIO_PORT
              valueFrom:
                configMapKeyRef:
                  name: todo-config
                  key: MINIO_PORT

            - name: MINIO_USE_SSL
              valueFrom:
                configMapKeyRef:
                  name: todo-config
                  key: MINIO_USE_SSL

            - name: MINIO_BUCKET
              valueFrom:
                configMapKeyRef:
                  name: todo-config
                  key: MINIO_BUCKET

            - name: MONGODB_URI
              valueFrom:
                secretKeyRef:
                  name: todo-secrets
                  key: MONGODB_URI

            - name: MONGO_URI
              valueFrom:
                secretKeyRef:
                  name: todo-secrets
                  key: MONGO_URI

            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: todo-secrets
                  key: JWT_SECRET

            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: todo-secrets
                  key: MINIO_ACCESS_KEY

            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: todo-secrets
                  key: MINIO_SECRET_KEY
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: todo-app
spec:
  type: NodePort
  selector:
    app: backend
  ports:
    - name: http
      port: 5000
      targetPort: 5000
      nodePort: 30500