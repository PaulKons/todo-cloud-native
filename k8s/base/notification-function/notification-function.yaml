apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-function
  namespace: todo-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notification-function
  template:
    metadata:
      labels:
        app: notification-function
    spec:
      containers:
        - name: notification-function
          image: localhost:32000/todo-notification-function:1.0
          imagePullPolicy: Always
          ports:
            - containerPort: 7000
          env:
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: todo-config
                  key: NODE_ENV
            - name: PORT
              value: "7000"
---
apiVersion: v1
kind: Service
metadata:
  name: notification-function
  namespace: todo-app
spec:
  type: ClusterIP
  selector:
    app: notification-function
  ports:
    - name: http
      port: 7000
      targetPort: 7000