apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq
  namespace: todo-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rabbitmq
  template:
    metadata:
      labels:
        app: rabbitmq
    spec:
      containers:
        - name: rabbitmq
          image: rabbitmq:3-management
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5672
            - containerPort: 15672
          env:
            - name: RABBITMQ_DEFAULT_USER
              value: "todo"
            - name: RABBITMQ_DEFAULT_PASS
              value: "todo"
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  namespace: todo-app
spec:
  type: NodePort
  selector:
    app: rabbitmq
  ports:
    - name: amqp
      port: 5672
      targetPort: 5672
      nodePort: 30673
    - name: management
      port: 15672
      targetPort: 15672
      nodePort: 30672