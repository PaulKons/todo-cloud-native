---
- name: Deploy Cloud Native ToDo App to MicroK8s
  hosts: local
  become: false

  vars:
    project_dir: "{{ lookup('env', 'HOME') }}/notebook"
    namespace: "todo-app"

  tasks:
    - name: Check MicroK8s status
      command: microk8s status --wait-ready
      changed_when: false

    - name: Enable required MicroK8s addons
      command: microk8s enable dns storage registry ingress
      register: addons_result
      changed_when: "'already enabled' not in addons_result.stdout"

    - name: Apply namespace
      command: microk8s kubectl apply -f {{ project_dir }}/k8s/base/namespace.yaml
      changed_when: true

    - name: Apply ConfigMap
      command: microk8s kubectl apply -f {{ project_dir }}/k8s/base/config/configmap.yaml
      changed_when: true

    - name: Create or update Kubernetes Secret from backend .env
      shell: |
        microk8s kubectl create secret generic todo-secrets \
          --namespace {{ namespace }} \
          --from-literal=MONGODB_URI="$(grep '^MONGODB_URI=' {{ project_dir }}/backend/.env | cut -d '=' -f2-)" \
          --from-literal=MONGO_URI="$(grep '^MONGO_URI=' {{ project_dir }}/backend/.env | cut -d '=' -f2-)" \
          --from-literal=JWT_SECRET="$(grep '^JWT_SECRET=' {{ project_dir }}/backend/.env | cut -d '=' -f2-)" \
          --from-literal=MINIO_ACCESS_KEY="minioadmin" \
          --from-literal=MINIO_SECRET_KEY="minioadmin123" \
          --dry-run=client -o yaml | microk8s kubectl apply -f -
      changed_when: true

    - name: Apply application manifests through Kustomize
      command: microk8s kubectl apply -k {{ project_dir }}/k8s/base
      changed_when: true

    - name: Wait for backend rollout
      command: microk8s kubectl rollout status deployment/backend -n {{ namespace }} --timeout=180s
      changed_when: false

    - name: Wait for frontend rollout
      command: microk8s kubectl rollout status deployment/frontend -n {{ namespace }} --timeout=180s
      changed_when: false

    - name: Wait for reminder-worker rollout
      command: microk8s kubectl rollout status deployment/reminder-worker -n {{ namespace }} --timeout=180s
      changed_when: false

    - name: Wait for attachment-processor rollout
      command: microk8s kubectl rollout status deployment/attachment-processor -n {{ namespace }} --timeout=180s
      changed_when: false

    - name: Show final pods
      command: microk8s kubectl get pods -n {{ namespace }}
      register: pod_status
      changed_when: false

    - name: Print pod status
      debug:
        var: pod_status.stdout_lines
