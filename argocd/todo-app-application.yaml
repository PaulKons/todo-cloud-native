apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: todo-cloud-native-app
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/PaulKons/todo-cloud-native.git
    targetRevision: main
    path: k8s/base

  destination:
    server: https://kubernetes.default.svc
    namespace: todo-app

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
